<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Huma-volve</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #f8f9fa; color: #2b2d42; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 450px; width: 100%; overflow: hidden; }
    .image-container { width: 100%; height: 320px; background: #eee; position: relative; }
    .image-container img { width: 100%; height: 100%; object-fit: cover; }
    .content { padding: 24px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #1e2022; }
    .price { font-size: 24px; font-weight: 700; color: #1e2022; margin-bottom: 16px; }
    .description { font-size: 14px; color: #8d99ae; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: block; width: 100%; padding: 16px; text-align: center; background: #1e2022; color: white; border-radius: 16px; font-weight: 600; text-decoration: none; border: none; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #3f4145; }
    .loading { text-align: center; padding: 50px; font-size: 18px; color: #8d99ae; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="loading">Loading product details...</div>
  </div>

  <script>
    async function loadProduct() {
      const pathParts = window.location.pathname.split('/');
      const productId = pathParts[pathParts.length - 1] || '1';

      try {
        const response = await fetch(`https://api.escuelajs.co/api/v1/products/${productId}`);
        const product = await response.json();

        const imgUrl = (product.images && product.images.length > 0) ? product.images[0] : 'https://via.placeholder.com/400';

        document.getElementById('app').innerHTML = `
          <div class="image-container">
            <img src="${imgUrl}" alt="${product.title}" />
          </div>
          <div class="content">
            <div class="title">${product.title || 'Product'}</div>
            <div class="price">$${(product.price || 0).toFixed(2)}</div>
            <div class="description">${product.description || ''}</div>
            <a href="humavolve://product/${product.id}" class="btn">Open in Huma-volve App</a>
          </div>
        `;
      } catch (err) {
        document.getElementById('app').innerHTML = `
          <div class="content">
            <div class="title">Product Not Found</div>
            <div class="description">Unable to load details for product #${productId}.</div>
          </div>
        `;
      }
    }

    loadProduct();
  </script>
</body>
</html>
